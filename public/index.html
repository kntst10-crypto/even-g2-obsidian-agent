<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vault Lens — Even G2 開発MVP</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><span class="eyebrow">VAULT LENS / DEVELOPMENT MVP</span><h1>思い出す。その場で残す。</h1><p>Obsidian × AI。G2実機・音声は未接続のブラウザ検証版です。</p></header>
<section><h2>接続</h2><label>ローカル接続トークン<input id="token" type="password" autocomplete="off" placeholder="AGENT_TOKEN（保存されません）"></label><label>回答エンジン<select id="provider"><option value="local">ローカル検索のみ（AI・外部通信なし）</option><option value="openai">OpenAI API</option><option value="claude">Claude API</option></select></label><label class="check"><input id="consent" type="checkbox">今回の質問・検索抜粋を選択したAI事業者へ送信することに同意</label><p class="hint">APIキーはPC側で設定します。Vault全体は送信せず、検索上位5件の抜粋を送ります。</p></section>
<section><h2>探す・考える</h2><label>検索語<input id="query" value="サンプル案件" placeholder="顧客名、案件名など"></label><label>質問・文面化する内容<textarea id="question" rows="3" placeholder="次の作業を教えて"></textarea></label><div class="actions"><button id="search">検索する</button><button id="answer">根拠付きで回答</button><button id="draft">LINE下書きにする</button></div></section>
<section><div class="heading"><h2>表示プレビュー</h2><span id="pageNumber"></span></div><div id="display" aria-live="polite">ローカル接続トークンを入力して、検索してください。</div><div class="actions"><button id="prev">前へ</button><button id="next">次へ</button></div><pre id="sources"></pre><button id="copyDraft">結果を追記欄へ</button></section>
<section><h2>確認して残す</h2><label>保存先<select id="destination"><option value="inbox">Inbox.md</option><option value="daily">今日のDaily Note</option><option value="note">指定ノート</option></select></label><label>指定ノートの相対パス<input id="path" placeholder="Projects/サンプル案件.md"></label><label>追記内容<textarea id="content" rows="4" placeholder="記録したいこと"></textarea></label><button id="propose">追記内容を確認</button><div id="confirmation" hidden><h3>この内容を追記しますか？</h3><pre id="proposal"></pre><button id="confirm">確認して保存</button><button id="cancel">取り消す</button></div></section>
<p id="status" role="status"></p><footer>ノートの削除・上書き・LINE送信・PC操作は行いません。音声とEven Hub対応は次の開発段階です。</footer>
</main><script type="module" src="/app.js"></script></body></html>
